server:
  port: 8083

spring:
  application:
    name: fraud-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fraud_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:keen-yak-170978.upstash.io}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gQAAAAAAApviAAIgcDIyYzVjMDczOGQ3NjE0ODIxODVlNjUyZDk1M2Y0ZWE3MA}
      ssl:
        enabled: ${REDIS_SSL:true}
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
      group-id: fraud-evaluation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.bank.transaction.dto.event,com.bank.fraud.dto.event"
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

fraud:
  rules:
    threshold:
      max-amount: 100000
    velocity:
      max-count: 5
      time-window-seconds: 60

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
