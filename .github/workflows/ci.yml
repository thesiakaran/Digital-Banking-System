name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # We need to run services in a specific order or just build them
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build Account Service
      run: cd account-service && mvn clean package -DskipTests
      
    - name: Build Fraud Service
      run: cd fraud-service && mvn clean package -DskipTests
      
    - name: Build Transaction Service
      run: cd transaction-service && mvn clean package -DskipTests
      
    - name: Build API Gateway
      run: cd api-gateway && mvn clean package -DskipTests
